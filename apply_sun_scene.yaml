alias: Apply Sun Scene
fields:
  room_prefix:
    description: Room prefix e.g. office_j, kitchen, guest_bathroom
sequence:
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 15
          - condition: template
            value_template: "{{ states('weather.forecast_lullwood') in ['sunny', 'partlycloudy'] }}"
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_energize
            data:
              transition: 2
            action: scene.turn_on
      - conditions:
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 15
          - condition: template
            value_template: "{{ states('weather.forecast_lullwood') == 'cloudy' }}"
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_cool_bright
            data:
              transition: 2
            action: scene.turn_on
      - conditions:
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 15
          - condition: template
            value_template: "{{ states('weather.forecast_lullwood') in ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'fog', 'snowy', 'snowy-rainy', 'hail'] }}"
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_rest
            data:
              transition: 2
            action: scene.turn_on
      - conditions:
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 5
            below: 15
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_relax
            data:
              transition: 2
            action: scene.turn_on
      - conditions:
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: -5
            below: 5
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_rest
            data:
              transition: 2
            action: scene.turn_on
      - conditions: []
        sequence:
          - target:
              entity_id: scene.{{ room_prefix }}_nightlight
            data:
              transition: 2
            action: scene.turn_on
mode: single
