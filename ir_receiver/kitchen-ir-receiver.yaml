substitutions:
  name: kitchen-ir-receiver
  friendly_name: Kitchen IR Receiver
  wifi: !secret wifi_ssid
  wifi_pass: !secret wifi_password
  ota_pass: "trustbutverifywalkingwithabigstick"

### No modifications needed below here ###
####################################################################################

esphome:
  name: $name
  friendly_name: $friendly_name
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_cpu: 80000000L
  name_add_mac_suffix: false

wifi:
  ssid: $wifi
  password: $wifi_pass
  power_save_mode: LIGHT
  ap:

captive_portal:

web_server:
  port: 80

esp32:
  board: lolin_c3_mini
  framework:
    type: esp-idf

api:

ota:
  - platform: esphome
    password: $ota_pass

logger:
  level: DEBUG

# HX-M121 IR receiver: DAT -> GPIO5, VCC -> 3V3, GND -> GND
# Apple A1156 uses the NEC protocol with address 0x77E1 and an 8-bit command
# byte (the second byte transmitted is its inverse). ESPHome's NEC decoder
# returns the command as a 16-bit value where the high byte is the inverted
# half — the codes below assume the documented Apple values. Confirm against
# your remote on first boot: `dump: all` will log every decoded frame to
# the logger so you can copy/paste the exact address+command into each
# on_nec block before the production flash.
remote_receiver:
  id: ir_rx
  pin:
    number: GPIO5
    inverted: true
    mode:
      input: true
      pullup: true
  dump: all
  tolerance: 55%
  buffer_size: 2kb
  idle: 25ms

binary_sensor:
  - platform: status
    name: Status

  - platform: remote_receiver
    name: IR Menu
    internal: true
    nec:
      address: 0x87EE
      command: 0x6602
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_menu

  - platform: remote_receiver
    name: IR Play/Pause
    internal: true
    nec:
      address: 0x87EE
      command: 0x6604
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_play_pause

  - platform: remote_receiver
    name: IR Next
    internal: true
    nec:
      address: 0x87EE
      command: 0x6607
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_next

  - platform: remote_receiver
    name: IR Prev
    internal: true
    nec:
      address: 0x87EE
      command: 0x6608
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_prev

  - platform: remote_receiver
    name: IR Volume Up
    internal: true
    nec:
      address: 0x87EE
      command: 0x660B
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_volume_up

  - platform: remote_receiver
    name: IR Volume Down
    internal: true
    nec:
      address: 0x87EE
      command: 0x660D
    on_press:
      - homeassistant.event:
          event: esphome.kitchen_ir_volume_down

sensor:
  - platform: internal_temperature
    name: ESP Temperature
    unit_of_measurement: °C
    device_class: TEMPERATURE
    update_interval: 30s
    entity_category: "diagnostic"
  - platform: uptime
    name: Uptime
    update_interval: 10s
  - platform: wifi_signal
    name: WiFi RSSI
    update_interval: 30s
    entity_category: "diagnostic"

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"

light:
  - platform: status_led
    name: sys_status
    pin:
      number: GPIO8
      inverted: true
    internal: true
    restore_mode: ALWAYS_OFF
