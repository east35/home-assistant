esphome:
  name: matrix-clock
  friendly_name: Matrix Clock

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB
  power_save_mode: none
  fast_connect: true
  ap:

captive_portal:
api:
logger:
ota:
  - platform: esphome
    password: "trustbutverifywalkingwithabigstick"

time:
  - platform: homeassistant
    id: ha_time

# Both pull from the same Pirate Weather entity.
# Find your entity ID in HA: Settings -> Devices & Services -> Pirate Weather.
# Common names: weather.pirateweather, weather.home
sensor:
  - platform: homeassistant
    id: outdoor_temp
    entity_id: weather.pirateweather        # TODO: confirm entity ID
    attribute: temperature

text_sensor:
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.pirateweather        # TODO: confirm entity ID

globals:
  - id: page
    type: int
    restore_value: no
    initial_value: '0'

interval:
  - interval: 5s
    then:
      - lambda: 'id(page) = (id(page) + 1) % 2;'

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO4

font:
  - file: "/Users/jimjordan/Development/home-assistant/PixelOperator8.ttf"
    id: font_main
    size: 8
    glyphs: "0123456789:.-° *abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ"

display:
  - platform: max7219digit
    id: matrix
    cs_pin: GPIO3
    num_chips: 4
    num_chip_lines: 1
    intensity: 15
    update_interval: 500ms
    lambda: |-
      it.fill(COLOR_OFF);

      // Center horizontally on the 32-col matrix (vertical midline of the strip).
      const int CENTER_X = 16;
      const int Y = 0;

      auto now = id(ha_time).now();
      if (!now.is_valid()) {
        it.print(CENTER_X, Y, id(font_main), TextAlign::TOP_CENTER, "SYNC");
        return;
      }

      if (id(page) == 0) {
        // Clock: HH:MM 24h, centered. Compact, no animation.
        it.strftime(CENTER_X, Y, id(font_main), TextAlign::TOP_CENTER, "%H:%M", now);
      } else {
        // Weather: temp + degree symbol, centered. Like "72°".
        float t = id(outdoor_temp).state;
        std::string c = id(weather_condition).state;
        ESP_LOGI("matrix", "cond='%s' temp=%.2f", c.c_str(), t);
        if (isnan(t)) {
          it.print(CENTER_X, Y, id(font_main), TextAlign::TOP_CENTER, "--°");
        } else {
          it.printf(CENTER_X, Y, id(font_main), TextAlign::TOP_CENTER, "%.0f°", t);
        }
      }
