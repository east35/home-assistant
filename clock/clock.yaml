esphome:
  name: desk-clock
  friendly_name: Desk Clock

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

api:

ota:
  - platform: esphome
    password: "trustbutverifywalkingwithabigstick"

time:
  - platform: homeassistant
    id: ha_time

globals:
  - id: brightness
    type: int
    restore_value: yes
    initial_value: '5'
  - id: display_on
    type: bool
    restore_value: no
    initial_value: 'true'

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Encoder Button"
    on_press:
      then:
        - lambda: |-
            id(display_on) = !id(display_on);

sensor:
  - platform: rotary_encoder
    id: brightness_encoder
    pin_a: GPIO7
    pin_b: GPIO6
    on_clockwise:
      then:
        - lambda: |-
            if (id(brightness) < 7) id(brightness) += 1;
            id(my_display).set_intensity(id(brightness));
    on_anticlockwise:
      then:
        - lambda: |-
            if (id(brightness) > 0) id(brightness) -= 1;
            id(my_display).set_intensity(id(brightness));

display:
  - platform: tm1637
    id: my_display
    clk_pin: GPIO20
    dio_pin: GPIO21
    intensity: 5
    lambda: |-
      if (!id(display_on)) {
        it.print("    ");
        return;
      }
      auto now = id(ha_time).now();
      if (now.second % 2 == 0) {
        it.strftime("%H.%M", now);
      } else {
        it.strftime("%H%M", now);
      }
